name: TRIX Wix Bridge 007 synthetic consent
on:
  pull_request:
    paths:
      - 'qualification/trix-wix-app-bridge-007-consent.mjs'
      - 'tests/trix-wix-app-bridge-007-consent.test.mjs'
      - '.github/workflows/trix-wix-app-bridge-007.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-007-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/trix-wix-app-bridge-007-consent.test.mjs
