<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; media-src blob:; img-src 'none'; object-src 'none'">
<title>TRIX V004-C5 — ciclo de vida qualificação</title>
<style>body{background:#10231f;color:#f4faf7;font:16px system-ui;margin:20px auto;max-width:650px;padding:0 12px}button{padding:12px;margin:5px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#071712;padding:12px}section{border:1px solid #527468;border-radius:12px;padding:12px;margin:12px 0}audio{width:100%}</style></head><body><h1>TRIX V004-C5</h1><p>Somente qualificação WebRTC local. Silêncio de 120/180 segundos é simulado por botões. Nenhuma autenticação ou cobrança real.</p>
<section><label><input id="admit" type="checkbox" checked> Admissão SINTÉTICA</label><p id="state">IDLE</p><button id="start">Iniciar / retomar com clique</button><button id="stop">Encerrar</button><button id="activity">Simular atividade do usuário</button><button id="warn">Simular 120 s</button><button id="end">Simular 180 s</button><audio id="audio" autoplay playsinline controls></audio><p id="status">Aguardando.</p></section>
<section><h2>Diagnóstico</h2><pre id="log"></pre><button id="copy">Copiar diagnóstico</button></section>
<script>
'use strict';
// Inlined verbatim reducer body from packages/voice/qualification/c2_voice_lifecycle.mjs at C2 qualification branch.
/** TRIX C2: isolated, deterministic browser lifecycle contract. No authority or network I/O. */
const STATES = Object.freeze({IDLE:'IDLE',ACTIVE:'ACTIVE',WARNING:'WARNING',PAUSED:'PAUSED',ENDED:'ENDED'});
function reduceVoice(s,e){
  if (!e || !Number.isFinite(e.at) || e.at<0 || !e.id || s.seen.includes(e.id) || (s.at!==null && e.at<s.at) || (e.generation!==undefined && e.generation!==s.generation)) return s;
  const next=(state,effect=null,extra={})=>({...s,...extra,state,effect,at:e.at,seen:[...s.seen,e.id]});
  if(e.type==='START'||e.type==='RESUME'){
    if(![STATES.IDLE,STATES.PAUSED,STATES.ENDED].includes(s.state)||!e.explicit||!e.admitted||!e.releaseReady)return s;
    return next(STATES.ACTIVE,'REQUEST_START',{generation:s.generation+1,lastUserActivity:e.at});
  }
  if(e.type==='HIDDEN'||e.type==='PAUSE'){
    if([STATES.ACTIVE,STATES.WARNING].includes(s.state))return next(STATES.PAUSED,'REQUEST_RELEASE');
    return s;
  }
  if(e.type==='STOP'||e.type==='FAILURE'||e.type==='PAGEHIDE'){
    if([STATES.ACTIVE,STATES.WARNING,STATES.PAUSED].includes(s.state))return next(STATES.ENDED,'REQUEST_RELEASE');
    return s;
  }
  if(e.type==='VISIBLE')return next(s.state);
  if(e.type==='USER_ACTIVITY'){
    if([STATES.ACTIVE,STATES.WARNING].includes(s.state))return next(STATES.ACTIVE,null,{lastUserActivity:e.at});
    return s;
  }
  if(e.type==='TICK'&&[STATES.ACTIVE,STATES.WARNING].includes(s.state)){
    const elapsed=e.at-s.lastUserActivity;
    if(elapsed>=180)return next(STATES.ENDED,'REQUEST_RELEASE');
    if(elapsed>=120&&s.state===STATES.ACTIVE)return next(STATES.WARNING,'REQUEST_WARNING');
    return next(s.state);
  }
  return s;
}
function initialVoice(continuityId='synthetic-longitudinal'){
 if(!continuityId)return null;
 return {continuityId,state:STATES.IDLE,generation:0,lastUserActivity:null,at:null,effect:null,seen:[]};
}

const $=id=>document.getElementById(id), logs=[];
let voice=initialVoice(), peerA=null,peerB=null,stream=null,sequence=0,token=0,releaseReady=true,startedAt=0;
function log(type,detail=''){logs.push(new Date().toISOString()+' '+type+' '+detail);$('log').textContent=logs.join('\n');}
function show(){ $('state').textContent='STATE='+voice.state+' generation='+voice.generation+' continuity='+voice.continuityId+' releaseReady='+releaseReady; }
function dispatch(type,at=Date.now()/1000,extra={}){
 const before=voice;const event={id:'c5-'+(++sequence),type,at,generation:voice.generation,...extra};
 voice=reduceVoice(voice,event);show();
 log('LIFECYCLE',type+' '+before.state+' -> '+voice.state+' effect='+voice.effect);
 return voice!==before?voice.effect:null;
}
function release(reason){
 token++;
 const tracks=stream?stream.getTracks():[];
 releaseReady=false;
 const before=tracks.map(t=>t.kind+':'+t.readyState).join(',')||'none';
 for(const t of tracks){try{t.stop();}catch(e){log('TRACK_STOP_ERROR',e.name);}}
 const after=tracks.map(t=>t.kind+':'+t.readyState).join(',')||'none';
 for(const pc of [peerA,peerB])if(pc){try{pc.close();}catch(e){log('PEER_CLOSE_ERROR',e.name);}}
 stream=null;peerA=null;peerB=null;$('audio').pause();$('audio').srcObject=null;
 releaseReady=tracks.every(t=>t.readyState==='ended');
 log('TRACK_RELEASE','before='+before+' after='+after);
 log('PEERS_CLOSED','local=true');
 log('LOCAL_RELEASE_OBSERVED','ready='+releaseReady+' remote_economic_confirmation=NOT_AVAILABLE reason='+reason);
 $('status').textContent='Captura local interrompida. Novo clique necessário.';show();
}
async function connect(id){
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia||typeof RTCPeerConnection==='undefined')throw Error('WEBRTC_API_UNAVAILABLE');
 log('MICROPHONE_REQUEST');
 const acquired=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
 if(id!==token||document.visibilityState!=='visible'){acquired.getTracks().forEach(t=>t.stop());log('LATE_MICROPHONE_RELEASED');return;}
 stream=acquired;log('MICROPHONE_GRANTED','tracks='+stream.getAudioTracks().length);
 peerA=new RTCPeerConnection({iceServers:[]});peerB=new RTCPeerConnection({iceServers:[]});
 const a=peerA,b=peerB;
 a.onicecandidate=e=>{if(e.candidate&&id===token)b.addIceCandidate(e.candidate).catch(()=>{});};
 b.onicecandidate=e=>{if(e.candidate&&id===token)a.addIceCandidate(e.candidate).catch(()=>{});};
 b.ontrack=e=>{if(id!==token)return;$('audio').srcObject=e.streams[0]||new MediaStream([e.track]);$('audio').play().catch(err=>log('PLAYBACK_BLOCKED',err.name));log('REMOTE_TRACK_RECEIVED',e.track.kind);};
 stream.getTracks().forEach(t=>a.addTrack(t,stream));
 const offer=await a.createOffer();if(id!==token)return;await a.setLocalDescription(offer);if(id!==token)return;await b.setRemoteDescription(a.localDescription);if(id!==token)return;
 const answer=await b.createAnswer();if(id!==token)return;await b.setLocalDescription(answer);if(id!==token)return;await a.setRemoteDescription(b.localDescription);if(id!==token)return;
 log('LOCAL_NEGOTIATION_COMPLETE','ice_servers=0');$('status').textContent='WebRTC local conectado; sessão ativa.';
}
$('start').onclick=()=>{
 if(document.visibilityState!=='visible'||!releaseReady||!$('admit').checked){log('START_REJECTED','visible='+document.visibilityState+' releaseReady='+releaseReady+' admitted='+$('admit').checked);return;}
 const effect=dispatch(voice.state==='IDLE'?'START':'RESUME',Date.now()/1000,{explicit:true,admitted:true,releaseReady:true});
 if(effect!=='REQUEST_START'){log('START_REJECTED_STATE');return;}
 releaseReady=false;const id=++token;startedAt=Date.now()/1000;
 connect(id).catch(e=>{if(id!==token)return;log('WEBRTC_ERROR',e.name+':'+e.message);dispatch('FAILURE');release('FAILURE');});
};
$('stop').onclick=()=>{dispatch('STOP');release('MANUAL_STOP');};
$('activity').onclick=()=>dispatch('USER_ACTIVITY');
$('warn').onclick=()=>{if(voice.lastUserActivity!==null)dispatch('TICK',Math.max(Date.now()/1000,voice.lastUserActivity+120));};
$('end').onclick=()=>{if(voice.lastUserActivity!==null){const effect=dispatch('TICK',Math.max(Date.now()/1000,voice.lastUserActivity+180));if(effect==='REQUEST_RELEASE')release('SYNTHETIC_180_SECONDS');}};
document.addEventListener('visibilitychange',()=>{log('VISIBILITY_CHANGE',document.visibilityState);if(document.visibilityState==='hidden'){dispatch('HIDDEN');release('BACKGROUND_HIDDEN');}else{dispatch('VISIBLE');log('FOREGROUND_NO_AUTO_RESUME');}});
window.addEventListener('pagehide',()=>{dispatch('PAGEHIDE');release('PAGEHIDE');});
$('copy').onclick=()=>navigator.clipboard.writeText(logs.join('\n')).catch(()=>log('COPY_UNAVAILABLE'));
show();log('TRIX_V004_C5_READY','reducer=C2_INLINED silence=SIMULATED_ONLY');
</script></body></html>
