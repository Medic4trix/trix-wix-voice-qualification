name: TRIX Minimal WebRTC Preflight (No Provider)
on:
  push:
    branches:
      - qualification/trix-realtime-minimal-preflight-001
    paths:
      - 'realtime-preflight.html'
      - 'tests/test_realtime_preflight_static.py'
      - '.github/workflows/trix-realtime-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate no-provider browser preflight
        run: python -m unittest discover -s tests -p 'test_realtime_preflight_static.py' -v
