name: TRIX Wix Bridge 008 synthetic HTTP
on:
  pull_request:
    paths:
      - 'qualification/trix-wix-app-bridge-008-http.mjs'
      - 'tests/trix-wix-app-bridge-008-http.test.mjs'
      - '.github/workflows/trix-wix-app-bridge-008.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bridge-008-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-http:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/trix-wix-app-bridge-008-http.test.mjs
